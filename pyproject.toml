[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiskaz"
version = "0.1.0"
description = "Push-to-talk-Diktierwerkzeug mit lokaler Spracherkennung"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "faster-whisper>=1.1",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whiskaz = "whiskaz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whiskaz = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
